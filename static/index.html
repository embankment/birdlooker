<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BirdLooker</title>
<style>
  :root {
    --bg: #11130f;
    --panel: #1b1e18;
    --line: #2e332a;
    --text: #e8ebe3;
    --dim: #8b9282;
    --accent: #9fd356;
    --warn: #e0a458;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  body { display: flex; flex-direction: column; }

  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  .status { color: var(--dim); font-size: 12px; }
  .status.live { color: var(--accent); }
  .status.error { color: var(--warn); }

  main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 16px; min-height: 0;
  }

  /* The stage carries the aspect ratio and the video fills it, rather
     than the video sizing the stage. Done the other way round, the
     video's max-height shrinks it but the stage keeps the width it
     computed from the video's unconstrained size -- so the stage ends
     up wider than the picture. That misplaces the overlay AND the click
     mapping, since clicks are measured against the stage.
     The ratio is set from the stream's real dimensions once metadata
     arrives; 4/3 is just the starting guess. */
  #stage {
    position: relative;
    aspect-ratio: 4 / 3;
    max-width: 100%; max-height: 100%;
    line-height: 0; cursor: crosshair;
    border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
    background: #000;
  }
  video {
    display: block; width: 100%; height: 100%;
    object-fit: contain;
  }

  /* Overlay marks are positioned in percentages and sized in pixels, so
     they cannot be stretched by the frame's aspect ratio. */
  #overlay { position: absolute; inset: 0; pointer-events: none; }

  #crosshair {
    position: absolute; left: 50%; top: 50%;
    width: 40px; height: 40px; margin: -20px 0 0 -20px;
    opacity: .4;
  }
  #crosshair::before, #crosshair::after {
    content: ""; position: absolute; background: var(--text);
  }
  #crosshair::before { left: 50%; top: 0; width: 1px; height: 100%; }
  #crosshair::after  { top: 50%; left: 0; height: 1px; width: 100%; }

  #marker {
    position: absolute; width: 44px; height: 44px;
    margin: -22px 0 0 -22px;
    border: 2px solid var(--accent); border-radius: 50%;
    opacity: 0; transition: opacity .25s;
  }
  #marker::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 4px; height: 4px; margin: -2px 0 0 -2px;
    background: var(--accent); border-radius: 50%;
  }

  footer {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 10px 16px; border-top: 1px solid var(--line);
    color: var(--dim); font-size: 12px;
  }
  .readout { font-variant-numeric: tabular-nums; color: var(--text); }
  .hint { margin-left: auto; }
  button {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 5px 11px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--dim); }
  .flash { color: var(--warn); }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f5f1; --panel: #fff; --line: #d8dcd1;
      --text: #1b1e18; --dim: #6b7363; --accent: #4a7c1f;
    }
  }
</style>
</head>
<body>

<header>
  <h1>BirdLooker</h1>
  <span class="status" id="status">connecting…</span>
</header>

<main>
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <div id="overlay">
      <div id="crosshair"></div>
      <div id="marker"></div>
    </div>
  </div>
</main>

<footer>
  <span>pan <span class="readout" id="pan">—</span>°</span>
  <span>tilt <span class="readout" id="tilt">—</span>°</span>
  <span id="moving"></span>
  <button id="center">Center</button>
  <span class="hint">click anywhere in the frame to look there</span>
</footer>

<script>
const video   = document.getElementById('video');
const stage   = document.getElementById('stage');
const overlay = document.getElementById('overlay');
const marker  = document.getElementById('marker');
const statusEl= document.getElementById('status');
const panEl   = document.getElementById('pan');
const tiltEl  = document.getElementById('tilt');
const movingEl= document.getElementById('moving');

const STREAM_URL = `http://${location.hostname}:8080`;

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = 'status' + (cls ? ' ' + cls : '');
}

// ---------------------------------------------------------------------
// WHEP client.
//
// Deliberately hand-rolled rather than pulling in a player library: the
// whole protocol is POST an SDP offer, get an SDP answer. No CDN means
// this works on a LAN with no internet, which is the point of a camera
// in the garden.
//
// pi-webrtc does not support trickle ICE, so we wait for gathering to
// finish and send one complete offer.
// ---------------------------------------------------------------------
async function connect() {
  setStatus('connecting…');

  const pc = new RTCPeerConnection({ iceServers: [] });
  pc.addTransceiver('video', { direction: 'recvonly' });

  pc.ontrack = (e) => { video.srcObject = e.streams[0]; };

  // Match the stage to the stream's real dimensions. Until this fires
  // the stage uses the 4/3 guess from CSS; afterwards the stage, the
  // video and the overlay are exactly the same rectangle, which is what
  // makes the click mapping correct.
  video.addEventListener('loadedmetadata', () => {
    if (video.videoWidth && video.videoHeight) {
      stage.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
    }
  });

  pc.oniceconnectionstatechange = () => {
    const s = pc.iceConnectionState;
    if (s === 'connected' || s === 'completed') setStatus('live', 'live');
    else if (s === 'failed')      setStatus('connection failed', 'error');
    else if (s === 'disconnected') setStatus('reconnecting…', 'error');
  };

  await pc.setLocalDescription(await pc.createOffer());

  // Wait out ICE gathering; pi-webrtc expects the complete offer.
  if (pc.iceGatheringState !== 'complete') {
    await new Promise((resolve) => {
      const done = () => {
        if (pc.iceGatheringState === 'complete') {
          pc.removeEventListener('icegatheringstatechange', done);
          resolve();
        }
      };
      pc.addEventListener('icegatheringstatechange', done);
      setTimeout(resolve, 3000);   // don't hang if a candidate stalls
    });
  }

  let answer;
  try {
    const res = await fetch(STREAM_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/sdp' },
      body: pc.localDescription.sdp,
    });
    if (!res.ok) throw new Error(`stream returned ${res.status}`);
    answer = await res.text();
  } catch (err) {
    setStatus(`no stream at ${STREAM_URL} — is pi-webrtc running?`, 'error');
    console.error(err);
    return;
  }

  await pc.setRemoteDescription({ type: 'answer', sdp: answer });
}

// ---------------------------------------------------------------------
// Clicks.
//
// #stage is sized by the video element itself, so the stage rect IS the
// video rect -- no letterbox arithmetic needed. If the layout ever lets
// the stage grow beyond the video, this is the first thing to revisit.
// ---------------------------------------------------------------------
stage.addEventListener('click', async (e) => {
  const r = stage.getBoundingClientRect();
  const nx = (e.clientX - r.left) / r.width;
  const ny = (e.clientY - r.top) / r.height;
  if (nx < 0 || nx > 1 || ny < 0 || ny > 1) return;

  // Mark it immediately. The round trip plus travel is a second or
  // more, and without this people click again thinking it missed.
  showMarker(nx, ny);

  try {
    const res = await fetch('/look', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ x: nx, y: ny }),
    });
    if (res.status === 429) {
      const body = await res.json();
      flash(`easy — ${body.retry_after}s`);
    } else if (!res.ok) {
      flash('rejected');
    }
  } catch (err) {
    flash('control server unreachable');
  }
});

let markerTimer = null;
function showMarker(nx, ny) {
  marker.style.left = (nx * 100).toFixed(2) + '%';
  marker.style.top  = (ny * 100).toFixed(2) + '%';
  marker.style.opacity = '1';
  clearTimeout(markerTimer);
  markerTimer = setTimeout(() => { marker.style.opacity = '0'; }, 1400);
}

let flashTimer = null;
function flash(msg) {
  movingEl.textContent = msg;
  movingEl.className = 'flash';
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => {
    movingEl.className = '';
    movingEl.textContent = '';
  }, 2000);
}

document.getElementById('center').addEventListener('click', (e) => {
  e.stopPropagation();
  fetch('/look', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ x: 0.5, y: 0.5 }),
  }).catch(() => flash('control server unreachable'));
});

// ---------------------------------------------------------------------
// Position feedback. Polling rather than SSE: simpler, and fine for the
// handful of viewers this will ever have.
// ---------------------------------------------------------------------
async function poll() {
  try {
    const s = await (await fetch('/state')).json();
    panEl.textContent  = s.pan.toFixed(1);
    tiltEl.textContent = s.tilt.toFixed(1);
    if (!flashTimer || movingEl.className !== 'flash') {
      movingEl.textContent = s.moving ? 'moving…' : '';
      movingEl.className = '';
    }
  } catch (err) { /* server restarting; next tick will catch up */ }
}
setInterval(poll, 200);
poll();

connect();
</script>
</body>
</html>
